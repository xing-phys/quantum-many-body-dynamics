project:
  type: book
  output-dir: _site
  resources: [data/, numerics/, research/, references/, demos/, figs/]
book:
  title: "Quantum Many-Body Dynamics and Quantum Information"
  subtitle: "From local quantum mechanics to the research frontier"
  author:
    - name: Ze-Yu Xing
      orcid: 0009-0009-5655-0187
      affiliations:
        - Institute of Physics, Chinese Academy of Sciences
        - University of Chinese Academy of Sciences
  date: "2026-10-22"
  date-format: long
  site-url: https://xing-phys.github.io/quantum-many-body-dynamics/
  repo-url: https://github.com/xing-phys/quantum-many-body-dynamics
  repo-actions: [edit, issue, source]
  search: true
  downloads: [pdf]
  output-file: quantum-many-body-dynamics
  cover-image: figs/cover.png
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - learning-map.qmd
    - part: "I · The language of quantum dynamics"
      chapters:
        - 01-state-information.qmd
        - 02-models-symmetries.qmd
        - 03-unitary-dynamics.qmd
        - 04-locality.qmd
        - 05-computational-toolkit.qmd
    - part: "II · Thermalization, chaos, and information spreading"
      chapters:
        - 06-equilibration-eth.qmd
        - 07-spectral-chaos.qmd
        - 08-entanglement-growth.qmd
        - 09-scrambling.qmd
        - 10-quantum-circuits.qmd
    - part: "III · Conservation laws, integrability, and transport"
      chapters:
        - 11-hydrodynamics.qmd
        - 12-linear-response.qmd
        - 13-integrability.qmd
        - 14-ghd.qmd
        - 15-anomalous-transport.qmd
        - 16-exact-circuits.qmd
    - part: "IV · Constraints, disorder, and periodic driving"
      chapters:
        - 17-disorder-localization.qmd
        - 18-mbl-transition.qmd
        - 19-scars-constraints.qmd
        - 20-floquet.qmd
        - 21-time-crystals.qmd
    - part: "V · Open, monitored, and encoded dynamics"
      chapters:
        - 22-open-systems.qmd
        - 23-trajectories.qmd
        - 24-dissipative-phases.qmd
        - 25-measurement-transitions.qmd
        - 26-information-error-correction.qmd
    - part: "VI · Methods and research frontiers"
      chapters:
        - 27-critical-dynamics.qmd
        - 28-kinetics-field-theory.qmd
        - 29-long-range-gauge.qmd
        - 30-platforms-protocols.qmd
        - 31-tensor-networks.qmd
        - 32-research-workshop.qmd
    - research-map.qmd
    - references.qmd
  appendices:
    - appendix-mathematics.qmd
    - computational-laboratory.qmd
  page-footer:
    left: "Quantum Many-Body Dynamics and Quantum Information"
    right: "Research edition · 22 October 2026"
bibliography:
  - references/core.bib
  - references/thermal.bib
  - references/transport.bib
  - references/information.bib
csl: assets/american-physics-society.csl
link-citations: true
lang: en
execute:
  enabled: false
format:
  html:
    theme:
      light: [cosmo, assets/theme-light.scss]
      dark: [darkly, assets/theme-dark.scss]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    fig-responsive: true
    link-external-newwindow: true
    include-in-header: assets/mathjax-config.html
    include-after-body: assets/labs-loader.html
  pdf:
    pdf-engine: lualatex
    documentclass: scrreprt
    papersize: a4
    geometry: [margin=24mm]
    fontsize: 10pt
    colorlinks: true
    toc: true
    toc-depth: 2
    number-sections: true
    include-in-header: assets/macros.sty
    keep-tex: false
    fig-pos: H
crossref:
  chapters: true
